
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小学4年生 理科クイズ</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#edf5f1;
 font-family:system-ui,sans-serif;
 color:#193d35;
}
main{
 max-width:650px;
 margin:auto;
 padding:24px 18px 50px;
}
h1{font-size:27px;text-align:center}
h2{font-size:23px}
p{line-height:1.7}
.card{
 background:white;
 border-radius:22px;
 padding:25px 20px;
 margin-top:20px;
 box-shadow:0 5px 20px #0000000b;
}
button{
 width:100%;
 padding:18px;
 margin:9px 0;
 border-radius:15px;
 border:2px solid #d7e5df;
 background:white;
 color:#193d35;
 font-size:17px;
 font-weight:bold;
 text-align:left;
 cursor:pointer;
}
button:disabled{cursor:default}
.primary{
 background:#148b73;
 color:white;
 text-align:center;
 border:0;
}
.correct{
 background:#dff7e9;
 border-color:#15966d;
}
.wrong{
 background:#ffe5e5;
 border-color:#e35b5b;
}
.small{color:#607b73;font-size:14px}
.progress{
 height:9px;
 background:#e4ece8;
 border-radius:10px;
 margin:20px 0;
 overflow:hidden;
}
.bar{
 height:100%;
 background:#15977b;
 transition:width .2s;
}
.feedback{
 background:#f0f7f4;
 padding:18px;
 border-radius:15px;
 margin-top:20px;
 line-height:1.8;
}
.hidden{display:none}
.center{text-align:center}
.score{
 font-size:52px;
 color:#148b73;
 font-weight:bold;
}
</style>
</head>
<body>
<main>
<div id="home">
<h1>🔬 小学4年生 理科クイズ</h1>
<p class="center">勉強したい単元を選ぼう！</p>
<div id="units"></div>
</div>

<div id="quiz" class="hidden">
<button onclick="home()" style="width:auto;padding:10px 15px">← 単元選択</button>
<div class="card">
<div id="counter" class="small"></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<h2 id="question"></h2>
<div id="answers"></div>
<div id="feedback" class="feedback hidden"></div>
<button id="next" class="primary hidden" onclick="nextQuestion()">次の問題へ →</button>
</div>
</div>

<div id="result" class="hidden">
<div class="card center">
<h2>結果発表！</h2>
<div id="score" class="score"></div>
<p id="message"></p>
<button class="primary" onclick="restart()">もう一度挑戦</button>
<button onclick="home()">単元選択に戻る</button>
</div>
</div>
</main>

<script>
const data=[
{
 title:"雨水のゆくえ",
 icon:"🌧️",
 questions:[
 {
 q:"雨が降ったあと、水がたまりやすい場所はどこ？",
 a:["高い場所","低い場所","日当たりのよい場所","風が強い場所"],
 c:1,
 e:"雨水は高いところから低いところへ流れるので、低い場所に集まりやすくなります。"
 },
 {
 q:"地面を流れる雨水は、どちらへ流れる？",
 a:["低いところから高いところ","高いところから低いところ","必ず北へ","必ず東へ"],
 c:1,
 e:"雨水は地面の傾きに沿って、高いところから低いところへ流れます。"
 },
 {
 q:"雨水が地面にしみこみやすいのは？",
 a:["コンクリート","アスファルト","砂の地面","金属の板"],
 c:2,
 e:"砂の粒の間にはすき間があり、水がしみこみやすくなっています。"
 },
 {
 q:"地面にしみこんだ水は、どうなることがある？",
 a:["地下へ進む","必ず空へ飛ぶ","石に変わる","光になる"],
 c:0,
 e:"地面にしみこんだ水は、土や砂のすき間を通って地下へ進むことがあります。"
 },
 {
 q:"水たまりの水が、晴れた日に少なくなる理由は？",
 a:["全部地面が吸い上げるから","水が水蒸気になって空気中へ出るから","水が石になるから","水が消滅するから"],
 c:1,
 e:"水は蒸発すると、目に見えない水蒸気になって空気中へ出ていきます。"
 }
]
},
{
 title:"星の明るさや色",
 icon:"⭐",
 questions:[
 {
 q:"夜空の星の明るさは、どれも同じ？",
 a:["すべて同じ","星によって違う","色だけ違う","毎日すべて同じ明るさになる"],
 c:1,
 e:"星には明るい星も暗い星もあり、明るさに違いがあります。"
 },
 {
 q:"星の色について正しいのは？",
 a:["全部白い","全部赤い","白やオレンジなど違いがある","昼は青くなる"],
 c:2,
 e:"星には白っぽいものやオレンジ色っぽいものなどがあります。"
 },
 {
 q:"1等星と6等星では、どちらが明るい？",
 a:["1等星","6等星","同じ","比べられない"],
 c:0,
 e:"星は明るいものから順に1等星、2等星、3等星と分けられます。"
 },
 {
 q:"夏の大三角をつくる星はどれ？",
 a:["ベガ・デネブ・アルタイル","太陽・月・地球","ベガ・北極星・アンタレス","アンタレス・月・デネブ"],
 c:0,
 e:"夏の大三角は、ベガ、デネブ、アルタイルという3つの明るい星を結んだものです。"
 },
 {
 q:"夏の南の空で赤っぽく見える1等星は？",
 a:["ベガ","デネブ","アンタレス","アルタイル"],
 c:2,
 e:"さそり座のアンタレスは、赤っぽく見える1等星です。"
 }
]
},
{
 title:"月と星の位置の変化",
 icon:"🌙",
 questions:[
 {
 q:"午後2時に南東の空に見えた半月は、時間がたつとどちらへ動く？",
 a:["東のほう","南のほう","北のほう","真下"],
 c:1,
 e:"半月は時間がたつと、東のほうから南のほうへ位置が変わります。"
 },
 {
 q:"月は時間がたつと、おおむねどちらへ動いて見える？",
 a:["東から西","西から東","北から南だけ","動かない"],
 c:0,
 e:"月は1日のうちでは、おおむね東から南の空を通って西へ動いて見えます。"
 },
 {
 q:"月の形について正しいのは？",
 a:["いつも満月","いつも半月","日によって変わる","毎日三日月"],
 c:2,
 e:"月は日によって見える形が変わり、約30日で元のような形に戻ります。"
 },
 {
 q:"同じ日の午後7時と午後9時で、星の位置は？",
 a:["変わらない","変わる","星が全部消える","色だけ変わる"],
 c:1,
 e:"星の位置は時間がたつと変わって見えます。"
 },
 {
 q:"時間がたつと、星座の星の並び方はどうなる？",
 a:["大きく変わる","逆さまに入れ替わる","ほとんど変わらない","星が増える"],
 c:2,
 e:"星座の位置は変わって見えますが、星どうしの並び方はほとんど変わりません。"
 },
 {
 q:"東の空の星は、時間がたつとどう見える？",
 a:["高いところへ動く","必ず低くなる","動かない","すべて消える"],
 c:0,
 e:"東の空の星は、時間がたつと高いところへ動いて見えます。"
 },
 {
 q:"南の空の星は、時間がたつとどう動いて見える？",
 a:["東から西へ","西から東へ","必ず真上へ","動かない"],
 c:0,
 e:"南の空の星は、時間がたつと西のほうへ位置が変わります。"
 },
 {
 q:"北の空の星は、何という星の近くを中心に回るように見える？",
 a:["ベガ","北極星","アンタレス","アルタイル"],
 c:1,
 e:"北の空の星は、北極星の近くを中心に回るように見えます。"
 }
]
}
];

let unit=0;
let index=0;
let points=0;
let answered=false;

function show(id){
 ["home","quiz","result"].forEach(x=>{
 document.getElementById(x).classList.toggle("hidden",x!==id);
 });
 window.scrollTo(0,0);
}

function home(){
 show("home");
}

function start(n){
 unit=n;
 index=0;
 points=0;
 render();
 show("quiz");
}

function render(){
 answered=false;
 const qs=data[unit].questions;
 const item=qs[index];
 document.getElementById("counter").textContent=
 data[unit].title+"　第"+(index+1)+"問 / "+qs.length+"問";
 document.getElementById("bar").style.width=
 ((index+1)/qs.length*100)+"%";
 document.getElementById("question").textContent=item.q;
 const area=document.getElementById("answers");
 area.innerHTML="";
 item.a.forEach((answer,i)=>{
 const b=document.createElement("button");
 b.textContent=String.fromCharCode(65+i)+"　"+answer;
 b.onclick=()=>select(i);
 area.appendChild(b);
 });
 document.getElementById("feedback").classList.add("hidden");
 document.getElementById("next").classList.add("hidden");
 document.getElementById("next").textContent=
 index===qs.length-1?"結果を見る →":"次の問題へ →";
}

function select(choice){
 if(answered)return;
 answered=true;
 const item=data[unit].questions[index];
 const ok=choice===item.c;
 if(ok)points++;
 const buttons=document.querySelectorAll("#answers button");
 buttons.forEach((b,i)=>{
 b.disabled=true;
 if(i===item.c)b.classList.add("correct");
 else if(i===choice)b.classList.add("wrong");
 });
 const f=document.getElementById("feedback");
 f.innerHTML="";
 const heading=document.createElement("strong");
 heading.textContent=ok?"⭕ 正解！":"❌ ざんねん！";
 const explanation=document.createElement("p");
 explanation.textContent=item.e;
 f.append(heading,explanation);
 f.classList.remove("hidden");
 document.getElementById("next").classList.remove("hidden");
}

function nextQuestion(){
 index++;
 if(index>=data[unit].questions.length){
 finish();
 }else{
 render();
 window.scrollTo(0,0);
 }
}

function finish(){
 const total=data[unit].questions.length;
 document.getElementById("score").textContent=points+" / "+total+"問";
 document.getElementById("message").textContent=
 points===total?"全問正解！すばらしい！":
 points>=total*0.7?"よくできました！":
 "解説を読んで、もう一度挑戦しよう！";
 show("result");
}

function restart(){
 start(unit);
}

const units=document.getElementById("units");
data.forEach((u,i)=>{
 const card=document.createElement("div");
 card.className="card";
 const title=document.createElement("h2");
 title.textContent=u.icon+" "+u.title;
 const desc=document.createElement("p");
 desc.className="small";
 desc.textContent=u.questions.length+"問のクイズ";
 const button=document.createElement("button");
 button.className="primary";
 button.textContent="この単元に挑戦 →";
 button.onclick=()=>start(i);
 card.append(title,desc,button);
 units.appendChild(card);
});
</script>
</body>
</html>
