function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function shuffle(array) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function showHome() {
  currentUnit = null;
  app.innerHTML = `
    <h1>🔬 小学4年生 理科クイズ</h1>
    <p class="muted">
      勉強したい単元を選ぼう！
    </p>
    ${UNITS.map((unit, index) => `
      <div class="card">
        <h2>${unit.icon} ${escapeHTML(unit.title)}</h2>
        <p class="muted">
          全${unit.questions.length}問
        </p>
        <button class="btn" onclick="startUnit(${index})">
          この単元にチャレンジ
        </button>
      </div>
    `).join("")}
  `;
}

function startUnit(index) {
  currentUnit = index;
  isReview = false;
  quiz = UNITS[index].questions.map((q, i) => ({
    question: q[0],
    correct: q[1],
    choices: shuffle(q.slice(1, 5)),
    explanation: q[5],
    number: i + 1
  }));

  currentIndex = 0;
  correctCount = 0;
  mistakes = [];

  showQuestion();
}

    <p class="muted">
      ${unit.icon} ${escapeHTML(unit.title)}
      ${isReview ? "・まちがえた問題の復習" : ""}
    </p>

    <div class="progress">
      <div class="bar" style="width:${progress}%"></div>
    </div>

    <p class="muted">
      ${currentIndex + 1} / ${quiz.length} 問
    </p>

    <div class="card">
      <h2>問題 ${item.number}</h2>
      <p style="font-size:19px;font-weight:bold">
        ${escapeHTML(item.question)}
      </p>

      <div id="choices">
        ${item.choices.map((choice, index) => `
          <button
            class="answer"
            onclick="chooseAnswer(${index})"
          >
            ${index + 1}. ${escapeHTML(choice)}
          </button>
        `).join("")}
      </div>

      <div id="result"></div>

      <button
        id="nextButton"
        class="btn"
        style="display:none"
        onclick="nextQuestion()"
      >
        ${currentIndex === quiz.length - 1
          ? "結果を見る"
          : "次の問題へ →"}
      </button>
    </div>
  `;
}

function chooseAnswer(index) {
  if (answered) return;
  answered = true;

  const item = quiz[currentIndex];
  const selected = item.choices[index];
  const isCorrect = selected === item.correct;

  if (isCorrect) {
    correctCount++;
  } else {
    mistakes.push(item);
  }

  const buttons = document.querySelectorAll(".answer");

  buttons.forEach((button, i) => {
    button.disabled = true;

    if (item.choices[i] === item.correct) {
      button.classList.add("correct");
    }

    if (i === index && !isCorrect) {
      button.classList.add("wrong");
    }
  });

  document.getElementById("result").innerHTML = `
    <div class="feedback">
      <h2>${isCorrect ? "⭕ 正解！" : "❌ ざんねん！"}</h2>
      <p>
        <strong>正しい答え：</strong><br>
        ${escapeHTML(item.correct)}
      </p>
      <p>
        <strong>解説：</strong><br>
        ${escapeHTML(item.explanation)}
      </p>
    </div>
  `;

  document.getElementById("nextButton").style.display = "block";
}

function nextQuestion() {
  currentIndex++;

  if (currentIndex >= quiz.length) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  const total = quiz.length;
  const percent = Math.round((correctCount / total) * 100);
  const unit = UNITS[currentUnit];

  app.innerHTML = `
    <h1>🎉 クイズ終了！</h1>

    <div class="card">
      <p class="muted" style="text-align:center">
        ${unit.icon} ${escapeHTML(unit.title)}
        ${isReview ? "・復習" : ""}
      </p>

      <div class="score">
        ${correctCount} / ${total}
      </div>

      <h2 style="text-align:center">
        正答率 ${percent}%
      </h2>

      <p style="text-align:center">
        ${percent === 100
          ? "全問正解！すばらしい！"
          : percent >= 80
          ? "よくできました！"
          : percent >= 60
          ? "あと少し！復習してみよう！"
          : "解説を読んで、もう一度チャレンジ！"}
      </p>

      ${mistakes.length > 0 ? `
        <button class="btn" onclick="reviewMistakes()">
          まちがえた${mistakes.length}問を復習する
        </button>
      ` : ""}

      <button class="btn secondary" onclick="startUnit(${currentUnit})">
        この単元をもう一度
      </button>

      <button class="btn secondary" onclick="showHome()">
        単元選択にもどる
      </button>
    </div>
  `;
}

function reviewMistakes() {
  quiz = mistakes.map(item => ({
    ...item,
    choices: shuffle(item.choices)
  }));

  currentIndex = 0;
  correctCount = 0;
  mistakes = [];
  isReview = true;

  showQuestion();
}

showHome();
</script>
</body>
</html>
