<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>理科チャレンジ｜雨水のゆくえ</title><style>*{box-sizing:border-box}body{margin:0;background:#eff8f5;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#17352f}.wrap{max-width:560px;margin:auto;padding:24px 16px 70px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:10px 0 4px}.tag{background:#d5eee6;border-radius:30px;padding:7px 12px;font-size:13px}.sub{color:#57736c;margin:0 0 22px}.panel{background:white;border-radius:24px;padding:24px 20px;box-shadow:0 10px 32px #174e3820}.progress{height:8px;background:#e6efec;border-radius:20px;overflow:hidden;margin:12px 0 28px}.bar{height:100%;background:#159879;transition:width .3s}.count{color:#56736c;font-size:14px}h2{font-size:21px;line-height:1.6;margin:0 0 23px}.option{display:flex;align-items:center;gap:12px;width:100%;border:2px solid #d9e8e2;background:white;border-radius:15px;padding:14px;margin:10px 0;font:inherit;text-align:left;cursor:pointer;color:#17352f;min-height:60px}.option b{display:grid;place-items:center;background:#e8f5f0;border-radius:10px;width:34px;height:34px;flex-shrink:0}.option:disabled{cursor:default}.option.correct{border-color:#159879;background:#e8f8f1}.option.wrong{border-color:#e77d78;background:#fff1ef}.feedback{background:#eff8f5;padding:16px;border-radius:15px;margin-top:22px;line-height:1.7}.feedback strong{font-size:19px}.primary{width:100%;border:0;background:#0f8870;color:white;font-size:17px;font-weight:bold;padding:16px;border-radius:14px;margin-top:20px;cursor:pointer}.primary:focus-visible,.option:focus-visible{outline:3px solid #e8a340}#score{text-align:center;font-size:52px;font-weight:800;color:#0f8870;margin:12px}.review{border-top:1px solid #e5eeea;padding:12px 0;line-height:1.6}.muted{color:#56736c;font-size:14px}.hide{display:none}footer{font-size:12px;color:#71867e;text-align:center;margin-top:24px}</style></head><body><main class="wrap"><header><div><h1>🌱 理科チャレンジ</h1><p class="sub">雨水のゆくえ</p></div><span class="tag">小学4年生</span></header><section class="panel"><div id="quiz"><div class="count" id="count"></div><div class="progress"><div class="bar" id="bar"></div></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><button class="primary hide" id="next">次の問題へ →</button></div><div id="result" class="hide"><h2 style="text-align:center">テスト終了！</h2><p class="muted" style="text-align:center">今回の得点</p><div id="score"></div><p id="message" style="text-align:center;font-weight:bold"></p><div id="review"></div><button class="primary" id="retry">もう一度チャレンジ</button></div></section><footer>ブラウザだけで遊べます。回答データは外部送信されません。</footer></main><script>const questions=[{q:'雨がふったとき、地面に落ちた雨水は、おもにどちらに流れますか？',o:['高いところから低いところ','低いところから高いところ','いつも北の方','いつも南の方'],a:0,e:'水は地面のかたむきにそって、高いところから低いところへ流れます。'},{q:'校庭で雨水がたまりやすいのは、どのような場所ですか？',o:['まわりより高い場所','まわりより低い場所','日当たりがよい場所','風が強い場所'],a:1,e:'低いところには、まわりから流れてきた雨水が集まりやすくなります。'},{q:'次のうち、水がしみこみやすいのはどれですか？',o:['コンクリート','アスファルト','すな','鉄の板'],a:2,e:'すなにはつぶとつぶの間にすき間があるため、水がしみこみやすい性質があります。'},{q:'すなと土では、水のしみこみ方がいつも同じである。',o:['○ 正しい','× まちがい'],a:1,e:'つぶの大きさやすき間などによって、水のしみこみ方はちがいます。'},{q:'雨水の流れる方向を調べるには、どのような方法がよいですか？',o:['地面の色だけを見る','地面の温度だけを調べる','地面の高さやかたむきを調べる','空の雲の数を数える'],a:2,e:'雨水は地面のかたむきにそって流れるため、高さやかたむきを調べると流れる方向を予想できます。'}];let index=0,answers=[];const $=id=>document.getElementById(id);function show(){let q=questions[index];$('count').textContent=`第 ${index+1} 問 / ${questions.length} 問`;$('bar').style.width=`${index/questions.length*100}%`;$('question').textContent=q.q;$('options').replaceChildren();$('feedback').classList.add('hide');$('next').classList.add('hide');q.o.forEach((v,i)=>{let b=document.createElement('button');b.className='option';let label=document.createElement('b');label.textContent=q.o.length===2?['○','×'][i]:['A','B','C','D'][i];let span=document.createElement('span');span.textContent=v;b.append(label,span);b.onclick=()=>choose(i);$('options').append(b)})}function choose(i){let q=questions[index];answers.push(i);[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').classList.remove('hide');$('feedback').replaceChildren();let strong=document.createElement('strong');strong.textContent=i===q.a?'⭕ 正解！':'❌ おしい！';let p=document.createElement('p');p.textContent=q.e;$('feedback').append(strong,p);$('next').textContent=index===questions.length-1?'結果を見る →':'次の問題へ →';$('next').classList.remove('hide')}$('next').onclick=()=>{index++;if(index<questions.length)show();else finish()};function finish(){$('quiz').classList.add('hide');$('result').classList.remove('hide');let score=answers.filter((a,i)=>a===questions[i].a).length;$('score').textContent=`${score*20} / 100点`;$('message').textContent=score===5?'全問正解！':score>=3?'よくできました！':'もう一度チャレンジしよう！';$('review').replaceChildren();questions.forEach((q,i)=>{let d=document.createElement('div');d.className='review';let t=document.createElement('strong');t.textContent=`${answers[i]===q.a?'⭕':'❌'} 第${i+1}問：${q.q}`;let p=document.createElement('div');p.className='muted';p.textContent=`正解：${q.o[q.a]}`;d.append(t,p);$('review').append(d)})}$('retry').onclick=()=>{index=0;answers=[];$('result').classList.add('hide');$('quiz').classList.remove('hide');show()};show();</script></body></html>
